services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ClothingAppDummyDB}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgadmin}
    volumes:
      - clothing_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ClothingAppDummyDB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  db-init:
    build:
      context: .
      target: backend
    command: ["sh", "-c", "cd /app/clothing_app && alembic upgrade head && python scripts/seed.py"]
    environment:
      CLOTHING_APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-pgadmin}@db:5432/${POSTGRES_DB:-ClothingAppDummyDB}
      CLOTHING_APP_STORE_ID: ${CLOTHING_APP_STORE_ID:-northstar}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      CLOTHING_APP_ENVIRONMENT: production
      CLOTHING_APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-pgadmin}@db:5432/${POSTGRES_DB:-ClothingAppDummyDB}
      CLOTHING_APP_DATABASE_POOL_SIZE: ${CLOTHING_APP_DATABASE_POOL_SIZE:-5}
      CLOTHING_APP_DATABASE_MAX_OVERFLOW: ${CLOTHING_APP_DATABASE_MAX_OVERFLOW:-5}
      CLOTHING_APP_PRODUCT_IMAGES_DIR: /app/tools/data/product_images
      CLOTHING_APP_FRONTEND_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      CLOTHING_APP_STORE_ID: ${CLOTHING_APP_STORE_ID:-northstar}
      CLOTHING_AGENT_ENVIRONMENT: production
      CLOTHING_AGENT_CLOTHING_APP_BASE_URL: http://127.0.0.1:8000
      CLOTHING_AGENT_FRONTEND_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      CLOTHING_AGENT_LLM_API_BASE: ${CLOTHING_AGENT_LLM_API_BASE:-https://api.groq.com/openai/v1}
      CLOTHING_AGENT_LLM_API_KEY: ${GROQ_API_KEY:-}
      CLOTHING_AGENT_LLM_MODEL: ${CLOTHING_AGENT_LLM_MODEL:-llama-3.3-70b-versatile}
      CLOTHING_AGENT_ALLOW_LOCAL_FALLBACK: ${CLOTHING_AGENT_ALLOW_LOCAL_FALLBACK:-true}
    volumes:
      - ./tools/data/product_images:/app/tools/data/product_images:ro
      - clothing_agent_state:/app/state/sessions
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      target: frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  clothing_db:
  clothing_agent_state:
