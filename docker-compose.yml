services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ClothingAppDummyDB}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - clothing_db:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ClothingAppDummyDB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  clothing-app:
    build:
      context: .
      target: clothing-app
    restart: unless-stopped
    environment:
      CLOTHING_APP_ENVIRONMENT: production
      CLOTHING_APP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ClothingAppDummyDB}
      CLOTHING_APP_DATABASE_POOL_SIZE: ${CLOTHING_APP_DATABASE_POOL_SIZE:-5}
      CLOTHING_APP_DATABASE_MAX_OVERFLOW: ${CLOTHING_APP_DATABASE_MAX_OVERFLOW:-5}
      CLOTHING_APP_PRODUCT_IMAGES_DIR: /app/local/product_images
      CLOTHING_APP_FRONTEND_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      CLOTHING_APP_LOG_DIR: /app/logs
    volumes:
      - ./local/product_images:/app/local/product_images:ro
      - clothing_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12

  clothing-agent:
    build:
      context: .
      target: clothing-agent
    restart: unless-stopped
    environment:
      CLOTHING_AGENT_ENVIRONMENT: production
      CLOTHING_AGENT_CLOTHING_APP_BASE_URL: http://clothing-app:8100
      CLOTHING_AGENT_CLOTHING_APP_TIMEOUT_SECONDS: ${CLOTHING_AGENT_CLOTHING_APP_TIMEOUT_SECONDS:-12}
      CLOTHING_AGENT_FRONTEND_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      CLOTHING_AGENT_LLM_API_BASE: ${CLOTHING_AGENT_LLM_API_BASE:-https://api.groq.com/openai/v1}
      CLOTHING_AGENT_LLM_API_KEY: ${GROQ_API_KEY:-}
      CLOTHING_AGENT_LLM_MODEL: ${CLOTHING_AGENT_LLM_MODEL:-openai/gpt-oss-120b}
      CLOTHING_AGENT_LLM_TIMEOUT_SECONDS: ${CLOTHING_AGENT_LLM_TIMEOUT_SECONDS:-45}
      CLOTHING_AGENT_ALLOW_LOCAL_FALLBACK: ${CLOTHING_AGENT_ALLOW_LOCAL_FALLBACK:-true}
      CLOTHING_AGENT_DISPLAYED_PRODUCT_LIMIT: ${CLOTHING_AGENT_DISPLAYED_PRODUCT_LIMIT:-3}
      CLOTHING_AGENT_MAXIMUM_CLARIFICATION_QUESTIONS: ${CLOTHING_AGENT_MAXIMUM_CLARIFICATION_QUESTIONS:-2}
      CLOTHING_AGENT_LOG_DIR: /app/logs
    volumes:
      - clothing_logs:/app/logs
    depends_on:
      clothing-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: .
      target: frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      clothing-agent:
        condition: service_healthy
      clothing-app:
        condition: service_healthy

volumes:
  clothing_db:
  clothing_logs:
